name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - profile-3d-contrib/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated profile
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D contributions [skip ci]"
          git push
